<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projetos do GitHub - Gabriel Mendonça">
    <title>Projetos GitHub | Gabriel Mendonça</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Configuração do Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#2563eb',
                            hover: '#1d4ed8',
                            light: '#dbeafe',
                        },
                        bg: {
                            main: '#f8fafc',
                            secondary: '#ffffff',
                            card: '#ffffff',
                        },
                        text: {
                            main: '#475569',
                            title: '#0f172a',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'hover': '0 10px 25px -5px rgba(37, 99, 235, 0.15)',
                    }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-bg-main text-text-main font-sans antialiased overflow-x-hidden selection:bg-brand selection:text-white">

    <!-- NAV BAR -->
    <nav class="fixed w-full z-50 top-0 left-0 bg-white/80 backdrop-blur-lg border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-text-title tracking-tight hover:text-brand transition-colors">
                Gabriel Mendonça
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-brand transition-colors flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-slate-100">
                <i class="ph ph-arrow-left"></i> Voltar ao Início
            </a>
        </div>
    </nav>

    <!-- HEADER -->
    <section class="pt-32 pb-12 px-6 bg-white border-b border-slate-200">
        <div class="max-w-4xl mx-auto text-center">
            <div class="inline-flex items-center gap-2 px-3 py-1 mb-6 text-xs font-bold tracking-widest text-brand uppercase bg-blue-50 rounded-full border border-blue-100">
                <i class="ph ph-github-logo text-lg"></i>
                GitHub Integration
            </div>
            <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-6">Meus Repositórios</h1>
            <p class="text-lg text-slate-500 max-w-2xl mx-auto">
                Explore meus projetos open-source, contribuições e experimentos de código diretamente do meu GitHub.
            </p>
        </div>
    </section>

    <!-- PROJECTS GRID -->
    <section class="py-16 px-6 bg-bg-main min-h-screen">
        <div class="max-w-6xl mx-auto">
            <div id="repos-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading Skeleton -->
                <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400">
                    <i class="ph ph-spinner animate-spin text-4xl mb-4 text-brand"></i>
                    <p>Carregando repositórios de @brunoom1...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="py-8 bg-white border-t border-slate-200 text-center">
        <p class="text-slate-500 text-sm">
            &copy; <span id="year"></span> Gabriel Mendonça. Dados fornecidos pela GitHub API.
        </p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        async function fetchRepos() {
            const username = 'brunoom1';
            const container = document.getElementById('repos-container');
            
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&direction=desc&per_page=100`);
                if (!response.ok) throw new Error('Falha ao carregar repositórios');
                
                const repos = await response.json();
                
                container.innerHTML = ''; // Limpar loading

                if (repos.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-slate-500">Nenhum repositório público encontrado.</p>';
                    return;
                }

                repos.forEach(repo => {
                    if (!repo.description) return;

                    const card = document.createElement('article');
                    card.className = 'bg-white rounded-xl border border-slate-200 p-6 hover:border-brand/50 hover:shadow-hover transition-all flex flex-col h-full group';
                    
                    const description = repo.description || 'Sem descrição fornecida.';
                    const language = repo.language || 'Code';
                    const updatedDate = new Date(repo.updated_at).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });

                    card.innerHTML = `
                        <div class="flex items-start justify-between mb-4">
                            <div class="p-3 bg-blue-50 text-brand rounded-lg group-hover:bg-brand group-hover:text-white transition-colors">
                                <i class="ph ${repo.fork ? 'ph-git-fork' : 'ph-git-repository'} text-2xl"></i>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="flex items-center gap-1 text-xs font-medium text-slate-400 bg-slate-50 px-2 py-1 rounded" title="Stars">
                                    <i class="ph ph-star-fill text-yellow-400"></i> ${repo.stargazers_count}
                                </div>
                            </div>
                        </div>
                        
                        <h3 class="text-lg font-bold text-slate-900 mb-2 group-hover:text-brand transition-colors truncate" title="${repo.name}">
                            ${repo.name}
                        </h3>
                        
                        <p class="text-sm text-slate-500 mb-6 flex-grow line-clamp-3">
                            ${description}
                        </p>
                        
                        <div class="flex items-center justify-between pt-4 border-t border-slate-100 mt-auto">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-semibold text-slate-600 flex items-center gap-1">
                                    <span class="w-2 h-2 rounded-full bg-brand"></span> ${language}
                                </span>
                                <span class="text-[10px] text-slate-400" title="Última atualização">
                                    ${updatedDate}
                                </span>
                            </div>
                            <a href="${repo.html_url}" target="_blank" class="text-sm font-medium text-brand hover:text-brand-hover flex items-center gap-1">
                                Ver <i class="ph ph-arrow-right"></i>
                            </a>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-red-500 mb-2">Ops! Não foi possível carregar os projetos.</p>
                        <p class="text-slate-400 text-sm mb-4">Verifique sua conexão ou tente novamente mais tarde.</p>
                        <a href="https://github.com/${username}" target="_blank" class="inline-flex items-center gap-2 px-6 py-3 bg-brand text-white rounded-lg hover:bg-brand-hover transition-colors">
                            <i class="ph ph-github-logo text-xl"></i>
                            Ir para o GitHub
                        </a>
                    </div>
                `;
            }
        }

        fetchRepos();
    </script>
</body>
</html>
